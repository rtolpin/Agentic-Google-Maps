name: Evals & Guardrails

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      judge:
        description: "Also run LLM-as-judge scoring + judge calibration"
        type: boolean
        default: false
      repeats:
        description: "Repeat each live case N times (measures variance)"
        default: "1"
      suite:
        description: "Run only this live suite (intent or synthesis); blank runs all"
        default: ""
      only:
        description: "Run only live cases whose id contains this text; blank runs all"
        default: ""

jobs:
  offline:
    # Free and deterministic — no API keys. Required on every PR.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Offline eval suites
        run: python -m evals.run --report eval-report-offline.json
      - name: Guardrail, eval & resilience tests
        run: python -m pytest tests/test_guardrails.py tests/test_evals_offline.py tests/test_clickhouse_unavailable.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report-offline
          path: backend/eval-report-offline.json

  live:
    # Calls the Anthropic API (costs money) — manual trigger only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Live eval suites
        run: >
          python -m evals.run --live
          ${{ inputs.suite && format('--suite {0}', inputs.suite) || '' }}
          ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
          ${{ inputs.judge && '--judge' || '' }}
          --repeats ${{ inputs.repeats }}
          --report eval-report-live.json --verbose
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report-live
          path: backend/eval-report-live.json
